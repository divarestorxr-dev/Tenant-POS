name: Release Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-pos-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 65432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      APP_ENV: development
      NODE_OPTIONS: --max-old-space-size=4096
      SUPABASE_PG_URL_DEV: postgresql://ci:ci@127.0.0.1:65432/ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:65432/ci
    steps:
      - uses: actions/checkout@v4
      - name: Secret credential scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN' -- . ':!*.md' ':!*.example*'; then
            echo "Committed private credential detected. Remove it and rotate the exposed key." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject disk-based runtime credential artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'writeFileSync\(runtimeBridgePath|writeRuntimeEnvBridge\(' -- scripts/hostinger-build.mjs scripts/hostinger-start.mjs; then
            echo 'Disk-based runtime credential persistence is forbidden.' >&2
            exit 1
          fi
          if find . -type f -name '.hostinger-runtime-env.json' -not -path './node_modules/*' -print -quit | grep -q .; then
            echo 'Runtime credential artifact detected in checkout/build output.' >&2
            exit 1
          fi
      - name: Prepare test database
        run: |
          pnpm --filter @workspace/db push-force
          pnpm --filter @workspace/db migrate
      - name: API tests
        run: pnpm --filter @workspace/api-server test
      - name: Admin Portal tests
        run: pnpm --filter @workspace/admin-portal test
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Audit build outputs for credential artifacts
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.hostinger-runtime-env.json' -o -name 'secret.bin' -o -name 'secret.enc' \) -not -path './node_modules/*' -print -quit | grep -q .; then
            echo 'Forbidden runtime credential artifact found after build.' >&2
            exit 1
          fi

